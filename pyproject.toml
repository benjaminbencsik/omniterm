[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniterm"
version = "0.1.0"
description = "A local-first coding and computer-control agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
]

[project.scripts]
omniterm = "omniterm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/omniterm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
