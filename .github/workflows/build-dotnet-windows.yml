name: Build Windows App

on:
  push:
    branches:
      - main
    paths:
      - "apps/desktop-dotnet/**"
      - ".github/workflows/build-dotnet-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-app:
    name: Build OmniTerm .NET app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore project
        run: dotnet restore apps/desktop-dotnet/OmniTerm.csproj

      - name: Build project
        run: dotnet build apps/desktop-dotnet/OmniTerm.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows app
        run: >-
          dotnet publish apps/desktop-dotnet/OmniTerm.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/OmniTerm
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/OmniTerm/OmniTerm.exe")) {
            throw "OmniTerm.exe was not produced."
          }
          Get-ChildItem "artifacts/OmniTerm" -File | Select-Object Name, Length

      - name: Create download ZIP
        shell: pwsh
        run: Compress-Archive -Path "artifacts/OmniTerm/*" -DestinationPath "artifacts/OmniTerm-Windows-x64.zip" -Force

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: OmniTerm-Windows-x64
          path: artifacts/OmniTerm-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
