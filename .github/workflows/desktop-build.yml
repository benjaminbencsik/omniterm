name: Build desktop installers

# Updating this workflow triggers a fresh preview build on main.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: omniterm-windows
            paths: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - name: macOS
            os: macos-latest
            artifact: omniterm-macos
            paths: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build native installer
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Upload compiled installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish downloadable release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download compiled installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'desktop-preview' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('OmniTerm {0}', github.ref_name) || 'OmniTerm Desktop Preview' }}
          body: |
            Download the installer for your operating system.

            Windows: use the `*-setup.exe` installer. An MSI may also be included.
            macOS: use the `.dmg` package.

            Preview packages are currently unsigned and macOS packages are not notarized.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.dmg
          fail_on_unmatched_files: true
