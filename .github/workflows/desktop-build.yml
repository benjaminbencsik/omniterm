name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows setup executable
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniTerm-Windows-Installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'windows-preview' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('OmniTerm {0}', github.ref_name) || 'OmniTerm Windows Preview' }}
          body: |
            Windows-only preview build.

            Download the file ending in `-setup.exe`, double-click it, complete installation, and launch OmniTerm from the Start menu.

            This preview is unsigned, so Windows SmartScreen may display a warning.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          fail_on_unmatched_files: true
