name: Build OmniTerm Windows

on:
  push:
    branches: [main]
    paths:
      - "OmniTerm/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omniterm-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore OmniTerm/OmniTerm.csproj --runtime win-x64

      - name: Build
        run: dotnet build OmniTerm/OmniTerm.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Publish single-file app
        run: >-
          dotnet publish OmniTerm/OmniTerm.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output release
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify output
        shell: pwsh
        run: |
          $exe = "release/OmniTerm.exe"
          if (-not (Test-Path $exe)) {
            throw "OmniTerm.exe was not produced."
          }
          $item = Get-Item $exe
          if ($item.Length -lt 1000000) {
            throw "OmniTerm.exe is unexpectedly small: $($item.Length) bytes"
          }
          Write-Host "Built $($item.FullName) ($($item.Length) bytes)"

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "release/OmniTerm.exe" -DestinationPath "OmniTerm-Windows-x64.zip" -Force

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: OmniTerm-Windows-x64
          path: OmniTerm-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
